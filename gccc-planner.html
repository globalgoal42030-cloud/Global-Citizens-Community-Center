<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCCC Advanced Planner — Field Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDE7D8;
  --paper-dim:#DFD8C4;
  --ink:#20241F;
  --panel:#262B22;
  --panel-2:#2E3428;
  --olive:#6E7B4E;
  --olive-dim:#4E5A38;
  --signal:#C4622D;
  --water:#3E6B72;
  --line:#4A503E;
  --paper-line: rgba(32,36,31,0.14);
  --ok:#7A9459;
  --font-display:'Big Shoulders Display', sans-serif;
  --font-body:'Archivo', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--panel);
  color:var(--paper);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}

/* ===== Shell ===== */
.shell{
  display:grid;
  grid-template-columns:76px 1fr;
  min-height:100vh;
}
@media (max-width:720px){
  .shell{grid-template-columns:56px 1fr;}
}

/* ===== Tab rail ===== */
.rail{
  background:var(--panel-2);
  border-right:2px solid var(--line);
  display:flex;
  flex-direction:column;
  align-items:stretch;
  padding:14px 0;
  gap:4px;
}
.rail-brand{
  font-family:var(--font-display);
  font-weight:800;
  color:var(--olive);
  writing-mode:vertical-rl;
  text-orientation:mixed;
  font-size:13px;
  letter-spacing:0.18em;
  text-align:center;
  padding:10px 0 22px;
  border-bottom:1px dashed var(--line);
  margin-bottom:8px;
}
.tab-btn{
  background:none;
  border:none;
  border-left:3px solid transparent;
  color:#9AA08C;
  padding:14px 4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  font-family:var(--font-mono);
  font-size:9px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  transition:all .15s ease;
}
.tab-btn .glyph{writing-mode:horizontal-tb;font-size:17px;}
.tab-btn:hover{color:var(--paper);background:rgba(255,255,255,0.03);}
.tab-btn.active{
  color:var(--paper);
  border-left-color:var(--signal);
  background:rgba(196,98,45,0.12);
}

/* ===== Main ===== */
.main{
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  position:relative;
  background-image:
    linear-gradient(var(--paper-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
  background-size:28px 28px;
}
.topbar{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  padding:26px 34px 14px;
  border-bottom:2px solid var(--ink);
}
.topbar h1{
  font-family:var(--font-display);
  font-weight:800;
  font-size:34px;
  letter-spacing:0.01em;
  margin:0;
  text-transform:uppercase;
}
.topbar .stamp{
  font-family:var(--font-mono);
  font-size:11px;
  border:2px solid var(--ink);
  padding:5px 10px;
  transform:rotate(-2deg);
  letter-spacing:0.05em;
}
.page{
  padding:28px 34px 80px;
  max-width:1080px;
}
.page[hidden]{display:none;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--water);
  margin:0 0 6px;
}
.section-title{
  font-family:var(--font-display);
  font-size:28px;
  font-weight:700;
  text-transform:uppercase;
  margin:0 0 18px;
  border-bottom:3px solid var(--ink);
  display:inline-block;
  padding-bottom:4px;
}
.card{
  background:#fff;
  border:1.5px solid var(--ink);
  padding:18px 20px;
  margin-bottom:18px;
  box-shadow:5px 5px 0 rgba(32,36,31,0.9);
}
.card h3{
  font-family:var(--font-display);
  font-size:19px;
  text-transform:uppercase;
  margin:0 0 12px;
  letter-spacing:0.02em;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
@media (max-width:800px){.grid-2,.grid-3{grid-template-columns:1fr;}}

label{
  display:block;
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--olive-dim);
  margin-bottom:4px;
}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],textarea,select{
  width:100%;
  padding:8px 10px;
  border:1.5px solid var(--ink);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  margin-bottom:12px;
}
textarea{resize:vertical;min-height:70px;}
.btn{
  border:1.5px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:9px 16px;
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.08em;
}
.btn:hover{background:var(--signal);border-color:var(--signal);}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.ghost:hover{background:var(--ink);color:var(--paper);}
.btn.danger{background:transparent;border-color:#8a2f1c;color:#8a2f1c;}
.btn.danger:hover{background:#8a2f1c;color:#fff;}
.btn.small{padding:5px 10px;font-size:10px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{
  text-align:left;
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  border-bottom:2px solid var(--ink);
  padding:8px 6px;
  color:var(--olive-dim);
}
td{padding:8px 6px;border-bottom:1px solid var(--paper-line);vertical-align:top;}
tr:hover td{background:rgba(110,123,78,0.06);}

.check-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--paper-line);}
.check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--olive);}
.check-row.done label{text-decoration:line-through;color:#9a9484;}
.check-row label{margin:0;font-family:var(--font-body);font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);}

.tag{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  padding:2px 8px;
  border:1px solid var(--ink);
  margin-right:6px;
}
.tag.p1{background:#8a2f1c;color:#fff;border-color:#8a2f1c;}
.tag.p2{background:var(--signal);color:#fff;border-color:var(--signal);}
.tag.p3{background:var(--olive);color:#fff;border-color:var(--olive);}

.subtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.subtab{
  border:1.5px solid var(--ink);
  background:transparent;
  padding:7px 14px;
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.06em;
}
.subtab.active{background:var(--ink);color:var(--paper);}
.subpage[hidden]{display:none;}

.searchbar{margin-bottom:14px;}
.conv-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;margin-bottom:6px;}
.conv-arrow{font-family:var(--font-mono);font-size:20px;padding-bottom:10px;color:var(--olive);}
.result{font-family:var(--font-mono);font-size:20px;font-weight:700;padding:8px 0;}

.month-nav{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.month-nav select,.month-nav input{width:auto;margin:0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--ink);border:2px solid var(--ink);}
.cal-head{background:var(--ink);color:var(--paper);font-family:var(--font-mono);font-size:10px;text-align:center;padding:6px 0;text-transform:uppercase;}
.cal-cell{background:#fff;min-height:78px;padding:5px;font-size:12px;position:relative;}
.cal-cell.empty{background:var(--paper-dim);}
.cal-cell .num{font-family:var(--font-mono);font-weight:700;font-size:11px;}
.cal-cell textarea{width:100%;height:44px;font-size:10.5px;border:none;background:transparent;padding:2px;margin:0;resize:none;}
.cal-cell textarea:focus{outline:1px solid var(--olive);background:#fff;}

.journal-entry{border-left:3px solid var(--olive);padding-left:14px;margin-bottom:20px;}
.journal-meta{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-mono);font-size:11px;color:var(--olive-dim);margin-bottom:4px;}
.journal-text{white-space:pre-wrap;font-size:14.5px;line-height:1.5;}
.mood-pill{border:1px solid var(--ink);padding:1px 8px;font-size:10px;text-transform:uppercase;font-family:var(--font-mono);}

.empty-state{font-family:var(--font-mono);font-size:12px;color:#9a9484;padding:16px 0;text-align:center;border:1.5px dashed var(--paper-line);}

.map-card{padding:0;overflow:hidden;}
.map-card .map-head{padding:14px 20px 0;}
.map-wrap{position:relative;padding:10px 14px 16px;}
.map-svg{width:100%;height:auto;display:block;}
.map-pin{position:absolute;width:10px;height:10px;background:var(--signal);border:2px solid var(--paper);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--ink);}
.map-pin-label{position:absolute;transform:translate(6px,-22px);font-family:var(--font-mono);font-size:10px;background:var(--ink);color:var(--paper);padding:1px 6px;white-space:nowrap;}
.map-caption{font-family:var(--font-mono);font-size:10px;color:#8d8674;padding:0 20px 14px;letter-spacing:0.03em;}
/* Tools: compass */
.compass-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 4px;}
.compass-dial{width:240px;height:240px;position:relative;}
.compass-dial svg{width:100%;height:100%;transition:transform .15s linear;}
.compass-status{font-family:var(--font-mono);font-size:12px;color:var(--olive-dim);text-align:center;}
.compass-heading{font-family:var(--font-display);font-size:42px;font-weight:800;}
.compass-msg{font-family:var(--font-mono);font-size:11.5px;color:#8d8674;text-align:center;max-width:380px;line-height:1.5;}

/* Tools: clock */
.clock-display{font-family:var(--font-mono);font-size:46px;font-weight:700;letter-spacing:0.02em;}
.clock-date{font-family:var(--font-mono);font-size:12px;color:var(--olive-dim);margin-top:-6px;}
.timer-display{font-family:var(--font-mono);font-size:40px;font-weight:700;text-align:center;padding:10px 0;}
.timer-controls,.stopwatch-controls{display:flex;gap:8px;flex-wrap:wrap;}
.alarm-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--paper-line);}
.alarm-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--olive);}
.alarm-time{font-family:var(--font-mono);font-size:18px;font-weight:700;width:90px;}
.alarm-banner{
  background:#8a2f1c;color:#fff;font-family:var(--font-mono);
  padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.75;}}
.lap-list{font-family:var(--font-mono);font-size:12px;max-height:140px;overflow:auto;margin-top:8px;}
.lap-list div{padding:3px 0;border-bottom:1px dashed var(--paper-line);}

/* Tools: radio */
.radio-link{
  display:flex;justify-content:space-between;align-items:center;
  border:1.5px solid var(--ink);padding:12px 14px;margin-bottom:10px;
  text-decoration:none;color:var(--ink);
}
.radio-link:hover{background:var(--ink);color:var(--paper);}
.radio-link .rname{font-family:var(--font-display);font-size:16px;text-transform:uppercase;}
.radio-link .rdesc{font-family:var(--font-mono);font-size:10.5px;opacity:0.75;}

.gg-strip{
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--water);
  border-top:1px dashed var(--paper-line);
  margin-top:26px;
  padding-top:10px;
}
.helper{font-family:var(--font-mono);font-size:11px;color:#8d8674;margin:-6px 0 16px;}
.two-col-form{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
@media (max-width:700px){.two-col-form{grid-template-columns:1fr;}}
.save-toast{
  position:fixed;bottom:18px;right:18px;
  background:var(--ink);color:var(--paper);
  font-family:var(--font-mono);font-size:11px;
  padding:9px 16px;border:1px solid var(--olive);
  opacity:0;transform:translateY(8px);
  transition:all .25s ease;
  pointer-events:none;
  z-index:50;
}
.save-toast.show{opacity:1;transform:translateY(0);}
</style>
</head>

      <h1 id="pageTitle">Atlas</h1>

<div class="save-toast" id="toast">Saved</div>

<script>
/* ============================================================
   CONFIG
============================================================ */
const TABS = [
  {id:'atlas', glyph:'◈', label:'Atlas'},
  {id:'measure', glyph:'⇄', label:'Measure'},
  {id:'kit', glyph:'▲', label:'Kit'},
  {id:'tools', glyph:'⊕', label:'Tools'},
  {id:'calendar', glyph:'▦', label:'Cal'},
  {id:'journal', glyph:'✎', label:'Journal'},
  {id:'contacts', glyph:'☎', label:'Contact'},
  {id:'todo', glyph:'☑', label:'To-Do'},
];

/* ============================================================
   STORAGE HELPERS
============================================================ */
async function saveKey(key, value){
  try{
    await window.storage.set(key, JSON.stringify(value));
    flashToast('Saved');
  }catch(e){ console.error('save failed', e); flashToast('Save failed'); }
}
async function loadKey(key, fallback){
  try{
    const r = await window.storage.get(key);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
let toastTimer;
function flashToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1200);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================================================
   RAIL / NAV
============================================================ */
const rail = document.getElementById('rail');
TABS.forEach(t=>{
  const b = document.createElement('button');
  b.className = 'tab-btn';
  b.dataset.tab = t.id;
  b.innerHTML = `<span class="glyph">${t.glyph}</span><span>${t.label}</span>`;
  b.onclick = ()=> showTab(t.id);
  rail.appendChild(b);
});
const pagesEl = document.getElementById('pages');
const pageTitleEl = document.getElementById('pageTitle');
const PAGE_TITLES = {atlas:'Atlas', measure:'Measurements', kit:'Emergency Kit', tools:'Field Tools', calendar:'Calendar', journal:'Journal', contacts:'Contacts', todo:'To-Do'};

function showTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.page').forEach(p=>p.hidden = (p.id !== 'page-'+id));
  pageTitleEl.textContent = PAGE_TITLES[id];
  localStorage.__gccc_nope; // noop, never use localStorage
}

/* ============================================================
   GG FOOTER (Global Goals rotator, decorative/static — cosmetic only)
============================================================ */
function ggStrip(n){
  const goals = [
    "1. No Poverty — Round up a purchase and donate the difference.",
    "2. Zero Hunger — Donate 3 shelf-stable items to a food pantry.",
    "3. Good Health — Drink water, stretch, log 8 hrs sleep.",
    "6. Clean Water — Check your go-bag's water & purification tablets.",
    "9. Infrastructure — Report a broken piece of public infrastructure.",
    "11. Sustainable Cities — Walk, bike, or carpool instead of driving solo.",
    "13. Climate Action — Track your household's energy or water use.",
  ];
  return `<div class="gg-strip">GG · GLOBAL GOAL ${esc(goals[n % goals.length])}</div>`;
}

/* ============================================================
   PAGE SHELLS
============================================================ */
function makePage(id){
  const d = document.createElement('div');
  d.className = 'page';
  d.id = 'page-'+id;
  d.hidden = true;
  pagesEl.appendChild(d);
  return d;
}
const pAtlas = makePage('atlas');
const pMeasure = makePage('measure');
const pKit = makePage('kit');
const pTools = makePage('tools');
const pCalendar = makePage('calendar');
const pJournal = makePage('journal');
const pContacts = makePage('contacts');
const pTodo = makePage('todo');

/* ---- Compass: uses the device's real magnetometer via DeviceOrientation ---- */
function renderCompass(){
  const el = document.getElementById('sub-compass');
  el.innerHTML = `
    <div class="grid-2">
      <div class="card">
        <h3>Digital Compass</h3>
        <div class="compass-wrap">
          <div class="compass-dial">
            <svg id="compassSvg" viewBox="0 0 240 240">
              <circle cx="120" cy="120" r="112" fill="#fff" stroke="var(--ink)" stroke-width="2"/>
              <g id="compassRose">
                ${[0,30,60,90,120,150,180,210,240,270,300,330].map(a=>{
                  const big = a%90===0;
                  const r1 = big?92:100, r2=110;
                  const rad = (a-90)*Math.PI/180;
                  const x1=120+r1*Math.cos(rad), y1=120+r1*Math.sin(rad);
                  const x2=120+r2*Math.cos(rad), y2=120+r2*Math.sin(rad);
                  return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--ink)" stroke-width="${big?2:1}" opacity="${big?1:0.5}"/>`;
                }).join('')}
                <text x="120" y="32" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="800" font-size="22" fill="var(--signal)">N</text>
                <text x="212" y="127" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="700" font-size="18" fill="var(--ink)">E</text>
                <text x="120" y="216" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="700" font-size="18" fill="var(--ink)">S</text>
                <text x="28" y="127" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="700" font-size="18" fill="var(--ink)">W</text>
              </g>
              <polygon points="120,40 129,120 120,110 111,120" fill="var(--signal)"/>
              <polygon points="120,200 129,120 120,130 111,120" fill="var(--ink)" opacity="0.6"/>
              <circle cx="120" cy="120" r="6" fill="var(--ink)"/>
            </svg>
          </div>
          <div class="compass-heading" id="compassHeadingNum">— °</div>
          <div class="compass-status" id="compassCardinal">Not enabled</div>
          <button class="btn" id="compassEnable">Enable Compass</button>
          <div class="compass-msg" id="compassMsg">Uses your device's real magnetometer via the DeviceOrientation sensor API. Works best on a phone, opened directly in the browser (not embedded). iOS will prompt for motion &amp; orientation permission.</div>
        </div>
      </div>
      <div class="card">
        <h3>No Sensor? Orient Manually</h3>
        <table>
          <tr><td><b>Sun method</b></td><td>Sun rises East, sets West. At local solar noon, the sun sits due South (Northern Hemisphere) or due North (Southern Hemisphere).</td></tr>
          <tr><td><b>Shadow-stick</b></td><td>Plant a stick, mark the tip of its shadow, wait 15 min, mark again. The line between marks runs roughly East→West.</td></tr>
          <tr><td><b>Analog watch</b></td><td>Point the hour hand at the sun. The line halfway between the hour hand and 12 points South (Northern Hemisphere).</td></tr>
          <tr><td><b>Polaris (night)</b></td><td>Follow the two "pointer stars" of the Big Dipper's cup — Polaris (true North) is roughly 5x that distance away.</td></tr>
        </table>
      </div>
    </div>`;

  let handler = null;
  let gotEvent = false;
  const rose = document.getElementById('compassRose');
  const headNum = document.getElementById('compassHeadingNum');
  const cardinalEl = document.getElementById('compassCardinal');
  const msgEl = document.getElementById('compassMsg');

  function cardinal(h){
    const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(h/22.5)%16];
  }
  function updateCompass(heading){
    gotEvent = true;
    heading = ((heading%360)+360)%360;
    rose.style.transform = `rotate(${-heading}deg)`;
    rose.style.transformOrigin = '120px 120px';
    headNum.textContent = heading.toFixed(0)+'°';
    cardinalEl.textContent = cardinal(heading) + ' — live from device sensor';
  }
  handler = function(e){
    let heading;
    if (typeof e.webkitCompassHeading === 'number') heading = e.webkitCompassHeading;
    else if (e.alpha !== null && e.alpha !== undefined) heading = 360 - e.alpha;
    else return;
    updateCompass(heading);
  };

  document.getElementById('compassEnable').onclick = async ()=>{
    cardinalEl.textContent = 'Requesting sensor access…';
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      try{
        const perm = await DeviceOrientationEvent.requestPermission();
        if (perm !== 'granted'){ cardinalEl.textContent='Permission denied.'; return; }
      }catch(err){
        cardinalEl.textContent = 'Permission request failed.';
        msgEl.textContent = "This browser blocked the sensor permission prompt — often happens inside an embedded preview. Try opening this file directly in your phone's browser.";
        return;
      }
    }
    if (!('DeviceOrientationEvent' in window)){
      cardinalEl.textContent = 'Not supported on this device/browser.';
      return;
    }
    window.addEventListener('deviceorientationabsolute', handler, true);
    window.addEventListener('deviceorientation', handler, true);
    setTimeout(()=>{
      if(!gotEvent){
        cardinalEl.textContent = 'No sensor data received.';
        msgEl.textContent = 'Your browser allowed the request but sent no data — common when this page runs inside an embedded frame (like a chat preview), which blocks sensor access for security. Open the downloaded HTML file directly on your phone for a live reading.';
      }
    }, 2500);
  };
}

/* ---- Clock, Stopwatch, Countdown Timer, Alarms ---- */
function renderClockTools(){
  const el = document.getElementById('sub-clock');
  el.innerHTML = `
    <div id="alarmBanner"></div>
    <div class="grid-2">
      <div class="card">
        <h3>Clock</h3>
        <div class="clock-display" id="liveClock">--:--:--</div>
        <div class="clock-date" id="liveDate"></div>
      </div>
      <div class="card">
        <h3>Countdown Timer</h3>
        <div class="timer-display" id="timerDisplay">05:00</div>
        <div class="grid-3" style="margin-bottom:8px;">
          <div><label>Min</label><input type="number" id="timerMin" value="5" min="0"></div>
          <div><label>Sec</label><input type="number" id="timerSec" value="0" min="0" max="59"></div>
          <div></div>
        </div>
        <div class="timer-controls">
          <button class="btn" id="timerStart">Start</button>
          <button class="btn ghost" id="timerPause">Pause</button>
          <button class="btn ghost" id="timerReset">Reset</button>
        </div>
      </div>
      <div class="card">
        <h3>Stopwatch</h3>
        <div class="timer-display" id="swDisplay">00:00.0</div>
        <div class="stopwatch-controls">
          <button class="btn" id="swStart">Start</button>
          <button class="btn ghost" id="swLap">Lap</button>
          <button class="btn ghost" id="swReset">Reset</button>
        </div>
        <div class="lap-list" id="swLaps"></div>
      </div>
      <div class="card">
        <h3>Alarms</h3>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <input type="time" id="alarmNew" style="margin:0;">
          <input type="text" id="alarmLabel" placeholder="Label (optional)" style="margin:0;">
          <button class="btn" id="alarmAdd">+ Add</button>
        </div>
        <div id="alarmList"></div>
      </div>
    </div>
    ${ggStrip(3)}
  `;

  // live clock
  function tickClock(){
    const now = new Date();
    document.getElementById('liveClock').textContent = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('liveDate').textContent = now.toLocaleDateString([], {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  }
  tickClock(); setInterval(tickClock, 1000);

  // beep
  let actx;
  function beep(times=3){
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      let t = actx.currentTime;
      for(let i=0;i<times;i++){
        const o = actx.createOscillator(), g = actx.createGain();
        o.type='sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.28);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t+0.3);
        t += 0.4;
      }
    }catch(e){}
  }

  // countdown timer
  let timerTotal = 300, timerLeft = 300, timerInt = null;
  function fmtTimer(s){
    s = Math.max(0, Math.round(s));
    const m = Math.floor(s/60), sec = s%60;
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  }
  function drawTimer(){ document.getElementById('timerDisplay').textContent = fmtTimer(timerLeft); }
  drawTimer();
  document.getElementById('timerStart').onclick = ()=>{
    if(timerInt) return;
    if(timerLeft<=0){
      timerTotal = (+document.getElementById('timerMin').value||0)*60 + (+document.getElementById('timerSec').value||0);
      timerLeft = timerTotal;
    }
    timerInt = setInterval(()=>{
      timerLeft -= 1;
      drawTimer();
      if(timerLeft<=0){
        clearInterval(timerInt); timerInt=null;
        beep(4);
        document.getElementById('timerDisplay').style.color = 'var(--signal)';
      }
    }, 1000);
  };
  document.getElementById('timerPause').onclick = ()=>{ clearInterval(timerInt); timerInt=null; };
  document.getElementById('timerReset').onclick = ()=>{
    clearInterval(timerInt); timerInt=null;
    timerTotal = (+document.getElementById('timerMin').value||0)*60 + (+document.getElementById('timerSec').value||0);
    timerLeft = timerTotal;
    document.getElementById('timerDisplay').style.color = '';
    drawTimer();
  };

  // stopwatch
  let swStart=0, swElapsed=0, swInt=null, laps=[];
  function fmtSw(ms){
    const cs = Math.floor(ms/100);
    const s = Math.floor(cs/10)%60, m = Math.floor(cs/600);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+(cs%10);
  }
  function drawSw(){ document.getElementById('swDisplay').textContent = fmtSw(swElapsed); }
  document.getElementById('swStart').onclick = (e)=>{
    if(swInt){ clearInterval(swInt); swInt=null; e.target.textContent='Start'; return; }
    swStart = Date.now()-swElapsed;
    swInt = setInterval(()=>{ swElapsed = Date.now()-swStart; drawSw(); }, 100);
    e.target.textContent='Pause';
  };
  document.getElementById('swLap').onclick = ()=>{
    if(!swInt) return;
    laps.unshift(fmtSw(swElapsed));
    document.getElementById('swLaps').innerHTML = laps.map((l,i)=>`<div>Lap ${laps.length-i} — ${l}</div>`).join('');
  };
  document.getElementById('swReset').onclick = ()=>{
    clearInterval(swInt); swInt=null; swElapsed=0; laps=[];
    document.getElementById('swStart').textContent='Start';
    document.getElementById('swLaps').innerHTML='';
    drawSw();
  };
  drawSw();

  // alarms
  (async ()=>{
    let alarms = await loadKey('tools:alarms', []);
    let firedToday = {};
    function drawAlarms(){
      document.getElementById('alarmList').innerHTML = alarms.length ? alarms.map(a=>`
        <div class="alarm-row">
          <input type="checkbox" data-id="${a.id}" ${a.on?'checked':''}>
          <span class="alarm-time">${esc(a.time)}</span>
          <span style="flex:1;font-family:var(--font-mono);font-size:12px;">${esc(a.label||'')}</span>
          <button class="btn danger small" data-del="${a.id}">✕</button>
        </div>`).join('') : `<div class="empty-state">No alarms set.</div>`;
      document.querySelectorAll('#alarmList input[type=checkbox]').forEach(cb=>cb.onchange=async()=>{
        alarms.find(a=>a.id===cb.dataset.id).on = cb.checked;
        await saveKey('tools:alarms', alarms);
      });
      document.querySelectorAll('#alarmList button[data-del]').forEach(b=>b.onclick=async()=>{
        alarms = alarms.filter(a=>a.id!==b.dataset.del);
        await saveKey('tools:alarms', alarms);
        drawAlarms();
      });
    }
    drawAlarms();
    document.getElementById('alarmAdd').onclick = async ()=>{
      const time = document.getElementById('alarmNew').value;
      if(!time) return;
      alarms.push({id:uid(), time, label:document.getElementById('alarmLabel').value, on:true});
      await saveKey('tools:alarms', alarms);
      document.getElementById('alarmLabel').value='';
      drawAlarms();
    };
    // check alarms every 10s while this page/tab is open
    setInterval(()=>{
      const now = new Date();
      const hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      alarms.forEach(a=>{
        if(a.on && a.time===hm){
          const fireKey = a.id+hm;
          if(!firedToday[fireKey]){
            firedToday[fireKey] = true;
            beep(5);
            document.getElementById('alarmBanner').innerHTML = `
              <div class="alarm-banner">
                <span>⏰ ALARM ${esc(hm)} — ${esc(a.label||'')}</span>
                <button class="btn ghost" style="color:#fff;border-color:#fff;" onclick="this.closest('.alarm-banner').remove()">Dismiss</button>
              </div>`;
          }
        }
      });
    }, 5000);
  })();
}

        <p class="helper">Water rule: 1 gal (3.8 L) per person per day, drinking + hygiene.</p>
      </div>
      <div class="card">
        <h3>Temperature</h3>
        <div class="conv-row">
          <div><label>Celsius</label><input type="number" id="c" value="37"></div>
          <div class="conv-arrow">→</div>
          <div><label>Fahrenheit</label><div class="result" id="f">98.6</div></div>
        </div>
        <p class="helper">37°C = 98.6°F = average normal human body temperature.</p>
      </div>
    </div>
    ${ggStrip(3)}
  `;
  const bind = (a,b,fn,fn2)=>{
    document.getElementById(a).oninput = e=>document.getElementById(b).textContent = fn(+e.target.value||0);
  };
  bind('mi','km', v=>(v*1.609).toFixed(3));
  bind('ft','m', v=>(v*0.3048).toFixed(3));
  bind('lb','kg', v=>(v*0.4536).toFixed(3));
  bind('gal','l', v=>(v*3.785).toFixed(3));
  bind('c','f', v=>(v*9/5+32).toFixed(1));
}

/* ============================================================
   EMERGENCY KIT TAB
============================================================ */
const KIT_ITEMS = {
  "Water & Filtration":["Water (1 gal/person/day, 3-day min)","Water purification tablets","Portable filter / straw","Collapsible water container"],
  "Food":["3-day supply, non-perishable","Manual can opener","High-energy / protein bars","Utensils, cup, small stove"],
  "Tools & Light":["Flashlight + extra batteries","Hand-crank / battery radio","Multi-tool or knife","Duct tape, paracord, whistle","Power bank + charging cable","Local paper map & compass"],
  "Health & Hygiene":["First aid kit","7-day supply of medications","Hand sanitizer, soap, wipes","Masks & gloves","Prescription glasses (spare)","Feminine / personal care items"],
  "Documents":["ID / passport copies","Insurance & medical records","Emergency cash (small bills)","This planner + pen","Family photos (contact aid)"],
  "Warmth & Comfort":["Change of clothes / socks","Emergency blanket","Rain poncho","Sturdy shoes","Sanitation bags / trowel"],
};
function renderKit(){
  pKit.innerHTML = `
    <p class="eyebrow">Section 3</p>
    <h2 class="section-title">Emergency Planning</h2>
    <div class="grid-2" id="kitCols"></div>
    <div class="card">
      <h3>Emergency Contacts</h3>
      <div id="ecRows"></div>
      <button class="btn" id="ecAdd">+ Add Contact Row</button>
    </div>
    <div class="card">
      <h3>Family / Group Meeting Plan</h3>
      <div class="two-col-form">
        <div><label>Primary meeting point (near home)</label><textarea id="mpPrimary" rows="2"></textarea></div>
        <div><label>Secondary meeting point (outside neighborhood)</label><textarea id="mpSecondary" rows="2"></textarea></div>
        <div><label>Out-of-town meeting point</label><textarea id="mpOOT" rows="2"></textarea></div>
        <div><label>Household emergency text/group chat</label><textarea id="mpChat" rows="2"></textarea></div>
        <div><label>Utility shut-off locations (gas/water/electric)</label><textarea id="mpUtil" rows="2"></textarea></div>
        <div><label>Special needs / pets / medical</label><textarea id="mpSpecial" rows="2"></textarea></div>
      </div>
      <p class="helper">Review and update this page every 6 months.</p>
    </div>
    ${ggStrip(4)}
  `;
  // checklists
  (async ()=>{
    const state = await loadKey('kit:checks', {});
    const cols = document.getElementById('kitCols');
    Object.entries(KIT_ITEMS).forEach(([group, items])=>{
      const card = document.createElement('div');
      card.className='card';
      card.innerHTML = `<h3>${group}</h3>` + items.map(item=>{
        const key = group+'::'+item;
        const checked = !!state[key];
        return `<div class="check-row ${checked?'done':''}"><input type="checkbox" data-key="${esc(key)}" ${checked?'checked':''}><label>${esc(item)}</label></div>`;
      }).join('');
      cols.appendChild(card);
    });
    cols.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.onchange = async ()=>{
        state[cb.dataset.key] = cb.checked;
        cb.closest('.check-row').classList.toggle('done', cb.checked);
        await saveKey('kit:checks', state);
      };
    });
  })();
  // emergency contacts
  (async ()=>{
    let contacts = await loadKey('kit:econtacts', [
      {role:'Household / Family', name:'', phone:'', notes:''},
      {role:'Out-of-area', name:'', phone:'', notes:''},
      {role:'Doctor / Pediatrician', name:'', phone:'', notes:''},
      {role:'Poison Control', name:'National', phone:'1-800-222-1222', notes:'24/7'},
    ]);
    function draw(){
      document.getElementById('ecRows').innerHTML = contacts.map((c,i)=>`
        <div class="grid-2" style="margin-bottom:8px;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;">
          <div><label>Role</label><input type="text" data-i="${i}" data-f="role" value="${esc(c.role)}"></div>
          <div><label>Name</label><input type="text" data-i="${i}" data-f="name" value="${esc(c.name)}"></div>
          <div><label>Phone</label><input type="text" data-i="${i}" data-f="phone" value="${esc(c.phone)}"></div>
          <div><label>Notes</label><input type="text" data-i="${i}" data-f="notes" value="${esc(c.notes)}"></div>
          <button class="btn danger small" data-del="${i}" style="margin-bottom:12px;">✕</button>
        </div>`).join('');
      document.querySelectorAll('#ecRows input').forEach(inp=>{
        inp.onblur = async ()=>{
          contacts[+inp.dataset.i][inp.dataset.f] = inp.value;
          await saveKey('kit:econtacts', contacts);
        };
      });
      document.querySelectorAll('#ecRows button[data-del]').forEach(b=>{
        b.onclick = async ()=>{
          contacts.splice(+b.dataset.del,1);
          await saveKey('kit:econtacts', contacts);
          draw();
        };
      });
    }
    draw();
    document.getElementById('ecAdd').onclick = async ()=>{
      contacts.push({role:'',name:'',phone:'',notes:''});
      await saveKey('kit:econtacts', contacts);
      draw();
    };
  })();
  // meeting plan
  (async ()=>{
    const mp = await loadKey('kit:meetingplan', {});
    const map = {mpPrimary:'primary',mpSecondary:'secondary',mpOOT:'oot',mpChat:'chat',mpUtil:'util',mpSpecial:'special'};
    Object.entries(map).forEach(([id,key])=>document.getElementById(id).value = mp[key]||'');
    Object.entries(map).forEach(([id,key])=>{
      document.getElementById(id).onblur = async ()=>{
        const cur = await loadKey('kit:meetingplan', {});
        cur[key] = document.getElementById(id).value;
        await saveKey('kit:meetingplan', cur);
      };
    });
  })();
}

/* ============================================================
   CALENDAR TAB
============================================================ */
function renderCalendar(){
  const now = new Date();
  pCalendar.innerHTML = `
    <p class="eyebrow">Section 4</p>
    <h2 class="section-title">Calendar</h2>
    <div class="card">
      <div class="month-nav">
        <label style="margin:0;">Month</label>
        <select id="calMonth"></select>
        <label style="margin:0;">Year</label>
        <input type="number" id="calYear" value="${now.getFullYear()}" style="width:90px;">
      </div>
      <div id="calGridWrap"></div>
      <p class="helper">Click any day's box to jot a note — saves automatically.</p>
    </div>
    ${ggStrip(5)}
  `;
  const monthSel = document.getElementById('calMonth');
  ['January','February','March','April','May','June','July','August','September','October','November','December'].forEach((m,i)=>{
    const o = document.createElement('option'); o.value=i; o.textContent=m;
    if(i===now.getMonth()) o.selected=true;
    monthSel.appendChild(o);
  });
  async function drawCal(){
    const month = +monthSel.value, year = +document.getElementById('calYear').value;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const key = `cal:${year}-${month}`;
    const notes = await loadKey(key, {});
    let cells = `<div class="cal-grid">` + ['S','M','T','W','T','F','S'].map(d=>`<div class="cal-head">${d}</div>`).join('');
    for(let i=0;i<firstDay;i++) cells += `<div class="cal-cell empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      cells += `<div class="cal-cell"><div class="num">${d}</div><textarea data-day="${d}" placeholder="note…">${esc(notes[d]||'')}</textarea></div>`;
    }
    cells += `</div>`;
    document.getElementById('calGridWrap').innerHTML = cells;
    document.querySelectorAll('#calGridWrap textarea').forEach(ta=>{
      ta.onblur = async ()=>{
        const cur = await loadKey(key, {});
        if(ta.value) cur[ta.dataset.day] = ta.value; else delete cur[ta.dataset.day];
        await saveKey(key, cur);
      };
    });
  }
  monthSel.onchange = drawCal;
  document.getElementById('calYear').onchange = drawCal;
  drawCal();
}

/* ============================================================
   JOURNAL TAB
============================================================ */
function renderJournal(){
  pJournal.innerHTML = `
    <p class="eyebrow">Section 5</p>
    <h2 class="section-title">Journal</h2>
    <div class="card">
      <h3>New Entry</h3>
      <div class="two-col-form">
        <div><label>Date</label><input type="date" id="jDate"></div>
        <div><label>Today I feel</label>
          <select id="jMood">
            <option>Steady</option><option>Grateful</option><option>Tired</option>
            <option>Anxious</option><option>Hopeful</option><option>Overwhelmed</option>
            <option>Calm</option><option>Determined</option>
          </select>
        </div>
      </div>
      <label>Entry</label>
      <textarea id="jText" rows="4" placeholder="Reflection, decision, or daily note…"></textarea>
      <button class="btn" id="jAdd">+ Save Entry</button>
    </div>
    <div id="jList"></div>
    ${ggStrip(0)}
  `;
  document.getElementById('jDate').valueAsDate = new Date();
  (async ()=>{
    let entries = await loadKey('journal:entries', []);
    function draw(){
      const list = document.getElementById('jList');
      if(!entries.length){ list.innerHTML = `<div class="empty-state">No journal entries yet. Your first one starts above.</div>`; return; }
      list.innerHTML = entries.slice().reverse().map(e=>`
        <div class="journal-entry">
          <div class="journal-meta">
            <span>${esc(e.date)} <span class="mood-pill">${esc(e.mood)}</span></span>
            <button class="btn danger small" data-id="${e.id}">Delete</button>
          </div>
          <div class="journal-text">${esc(e.text)}</div>
        </div>`).join('');
      list.querySelectorAll('button[data-id]').forEach(b=>b.onclick = async ()=>{
        entries = entries.filter(e=>e.id!==b.dataset.id);
        await saveKey('journal:entries', entries);
        draw();
      });
    }
    draw();
    document.getElementById('jAdd').onclick = async ()=>{
      const date = document.getElementById('jDate').value;
      const mood = document.getElementById('jMood').value;
      const text = document.getElementById('jText').value.trim();
      if(!text) return;
      entries.push({id:uid(), date, mood, text});
      await saveKey('journal:entries', entries);
      document.getElementById('jText').value='';
      draw();
    };
  })();
}

/* ============================================================
   CONTACTS TAB
============================================================ */
function renderContacts(){
  pContacts.innerHTML = `
    <p class="eyebrow">Section 6</p>
    <h2 class="section-title">Contacts</h2>
    <div class="card">
      <h3>Add Contact</h3>
      <div class="grid-3">
        <div><label>Name</label><input type="text" id="cName"></div>
        <div><label>Relationship</label><input type="text" id="cRel"></div>
        <div><label>Phone</label><input type="tel" id="cPhone"></div>
      </div>
      <label>Email / Address</label>
      <input type="text" id="cEmail">
      <button class="btn" id="cAdd">+ Add Contact</button>
    </div>
    <div class="card">
      <h3>All Contacts</h3>
      <div id="cList"></div>
    </div>
    ${ggStrip(1)}
  `;
  (async ()=>{
    let contacts = await loadKey('contacts:list', []);
    function draw(){
      document.getElementById('cList').innerHTML = contacts.length ? `<table><tr><th>Name</th><th>Relationship</th><th>Phone</th><th>Email/Address</th><th></th></tr>${
        contacts.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.rel)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td><button class="btn danger small" data-id="${c.id}">✕</button></td></tr>`).join('')
      }</table>` : `<div class="empty-state">No contacts saved yet.</div>`;
      document.querySelectorAll('#cList button[data-id]').forEach(b=>b.onclick = async ()=>{
        contacts = contacts.filter(c=>c.id!==b.dataset.id);
        await saveKey('contacts:list', contacts);
        draw();
      });
    }
    draw();
    document.getElementById('cAdd').onclick = async ()=>{
      const name=document.getElementById('cName').value.trim();
      if(!name) return;
      contacts.push({id:uid(), name, rel:document.getElementById('cRel').value, phone:document.getElementById('cPhone').value, email:document.getElementById('cEmail').value});
      await saveKey('contacts:list', contacts);
      ['cName','cRel','cPhone','cEmail'].forEach(id=>document.getElementById(id).value='');
      draw();
    };
  })();
}

/* ============================================================
   TO-DO TAB
============================================================ */
function renderTodo(){
  pTodo.innerHTML = `
    <p class="eyebrow">Section 7</p>
    <h2 class="section-title">To-Do</h2>
    <div class="card">
      <h3>Add Task</h3>
      <div class="grid-3">
        <div><label>Priority</label>
          <select id="tPriority"><option value="p1">P1 — Urgent</option><option value="p2" selected>P2 — Soon</option><option value="p3">P3 — Whenever</option></select>
        </div>
        <div style="grid-column:span 2;"><label>Task</label><input type="text" id="tText" placeholder="What needs doing?"></div>
      </div>
      <button class="btn" id="tAdd">+ Add Task</button>
    </div>
    <div class="card">
      <h3>Task List</h3>
      <div id="tList"></div>
    </div>
    ${ggStrip(6)}
  `;
  (async ()=>{
    let tasks = await loadKey('todo:tasks', []);
    function draw(){
      const list = document.getElementById('tList');
      if(!tasks.length){ list.innerHTML = `<div class="empty-state">No tasks yet — add one above.</div>`; return; }
      const order = {p1:0,p2:1,p3:2};
      const sorted = tasks.slice().sort((a,b)=>(a.done-b.done)||(order[a.priority]-order[b.priority]));
      list.innerHTML = sorted.map(t=>`
        <div class="check-row ${t.done?'done':''}">
          <input type="checkbox" data-id="${t.id}" ${t.done?'checked':''}>
          <span class="tag ${t.priority}">${t.priority.toUpperCase()}</span>
          <label style="flex:1;">${esc(t.text)}</label>
          <button class="btn danger small" data-del="${t.id}">✕</button>
        </div>`).join('');
      list.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange = async ()=>{
        tasks.find(t=>t.id===cb.dataset.id).done = cb.checked;
        await saveKey('todo:tasks', tasks);
        draw();
      });
      list.querySelectorAll('button[data-del]').forEach(b=>b.onclick = async ()=>{
        tasks = tasks.filter(t=>t.id!==b.dataset.del);
        await saveKey('todo:tasks', tasks);
        draw();
      });
    }
    draw();
    document.getElementById('tAdd').onclick = async ()=>{
      const text = document.getElementById('tText').value.trim();
      if(!text) return;
      tasks.push({id:uid(), text, priority:document.getElementById('tPriority').value, done:false});
      await saveKey('todo:tasks', tasks);
      document.getElementById('tText').value='';
      draw();
    };
  })();
}
