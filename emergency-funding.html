<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Need Money Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0b2e22;
    --bg-mid:#12402f;
    --money:#3fae67;
    --gold:#e2b649;
    --cream:#f3ecd9;
    --ink:#08170f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:
      radial-gradient(circle at 50% -10%, var(--bg-mid), var(--bg-deep) 60%);
    font-family:'Space Grotesk', system-ui, sans-serif;
    color:var(--cream);
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    position:relative;
  }
  #confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:5;
  }
  .bill{
    position:absolute;
    top:-40px;
    font-size:28px;
    will-change:transform, opacity;
    animation-name:fall;
    animation-timing-function:ease-in;
    animation-fill-mode:forwards;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));
  }
  @keyframes fall{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    100%{ transform:translateY(110vh) translateX(var(--drift)) rotate(var(--spin)); opacity:0.85; }
  }

  main{
    position:relative;
    z-index:2;
    max-width:520px;
    width:100%;
    text-align:center;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(226,182,73,0.4);
    border-radius:999px;
    padding:6px 16px;
    margin-bottom:22px;
  }
  .eyebrow::before{
    content:'';
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px var(--gold);
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-optical-sizing:auto;
    font-size:clamp(32px, 7vw, 52px);
    line-height:1.05;
    color:var(--cream);
    margin-bottom:16px;
    letter-spacing:-0.01em;
  }
  h1 .accent{
    color:var(--gold);
    font-style:italic;
    font-weight:600;
  }

  p.sub{
    font-size:clamp(15px, 2.4vw, 17px);
    color:rgba(243,236,217,0.72);
    line-height:1.55;
    max-width:420px;
    margin:0 auto 40px;
  }
  p.sub b{ color:var(--cream); font-weight:600; }

  #dollarBtn{
    -webkit-appearance:none;
    appearance:none;
    border:none;
    cursor:pointer;
    width:128px;
    height:128px;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, #58c47e, var(--money) 55%, #2c8b4f 100%);
    box-shadow:
      0 0 0 6px rgba(63,174,103,0.15),
      0 12px 30px rgba(10,60,35,0.55),
      inset 0 2px 4px rgba(255,255,255,0.3);
    font-size:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 14px;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    position:relative;
  }
  #dollarBtn:hover{ transform:translateY(-3px) scale(1.03); }
  #dollarBtn:active{ transform:translateY(1px) scale(0.97); }
  #dollarBtn:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:4px;
  }
  #dollarBtn::after{
    content:'';
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:2px dashed rgba(226,182,73,0.5);
    animation:spin 14s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .tap-label{
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(243,236,217,0.55);
    margin-bottom:44px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    color:rgba(243,236,217,0.35);
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    margin:0 0 24px;
  }
  .divider::before, .divider::after{
    content:'';
    flex:1;
    height:1px;
    background:rgba(243,236,217,0.18);
  }

  .sponsor-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background:rgba(243,236,217,0.06);
    border:1px solid rgba(243,236,217,0.14);
    border-radius:16px;
    padding:18px 22px;
    text-align:left;
    text-decoration:none;
    color:inherit;
    transition:background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .sponsor-card:hover{
    background:rgba(226,182,73,0.08);
    border-color:rgba(226,182,73,0.4);
    transform:translateY(-2px);
  }
  .sponsor-card:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:3px;
  }
  .sponsor-text .label{
    font-size:15px;
    font-weight:600;
    color:var(--cream);
    margin-bottom:2px;
  }
  .sponsor-text .sub{
    font-size:12.5px;
    color:rgba(243,236,217,0.55);
    margin:0;
  }
  .sponsor-arrow{
    font-size:20px;
    color:var(--gold);
    flex-shrink:0;
  }

  @media (prefers-reduced-motion: reduce){
    .bill{ animation:none !important; display:none; }
    #dollarBtn::after{ animation:none; }
  }
</style>
</head>
<body>

<div id="confetti-layer"></div>

<main>
  <span class="eyebrow">Emergency Funding</span>
  <h1>Need money <span class="accent">now?</span></h1>
  <p class="sub">
    For emergencies, bills, mortgage payments, or <b>business</b> costs that can't wait —
    tap the dollar to get your fundraiser kit and start raising today.
  </p>

  <button id="dollarBtn" aria-label="Get the fundraiser kit">💵</button>
  <div class="tap-label">Tap for your fundraiser kit</div>

  <div class="divider">or</div>

  <a class="sponsor-card" href="mailto:rosewilliams@sffeep.org?subject=Sponsorship%20Inquiry" target="_blank" rel="noopener">
    <div class="sponsor-text">
      <div class="label">Need sponsorship?</div>
      <p class="sub">Reach out for niche sponsorship opportunities</p>
    </div>
    <span class="sponsor-arrow">→</span>
  </a>
</main>

<script>
(function(){
  const btn = document.getElementById('dollarBtn');
  const layer = document.getElementById('confetti-layer');
  const FUNDRAISER_URL = 'https://globalgoal42030-cloud.github.io/Global-Citizens-Community-Center/bake-sale-kit.html';
  const bills = ['💵','💰','🪙','💸'];
  let firing = false;

  function launchMoney(){
    if(firing) return;
    firing = true;
    const count = 46;
    for(let i=0;i<count;i++){
      setTimeout(()=>{
        const el = document.createElement('span');
        el.className = 'bill';
        el.textContent = bills[Math.floor(Math.random()*bills.length)];
        const startX = Math.random()*100;
        const drift = (Math.random()*160-80) + 'px';
        const spin = (Math.random()*720-360) + 'deg';
        const duration = 1.6 + Math.random()*1.1;
        el.style.left = startX+'vw';
        el.style.setProperty('--drift', drift);
        el.style.setProperty('--spin', spin);
        el.style.animationDuration = duration+'s';
        el.style.fontSize = (20+Math.random()*22)+'px';
        layer.appendChild(el);
        setTimeout(()=> el.remove(), duration*1000+200);
      }, i*18);
    }
  }

  btn.addEventListener('click', ()=>{
    launchMoney();
    setTimeout(()=>{
      window.open(FUNDRAISER_URL, '_blank', 'noopener');
      firing = false;
    }, 900);
  });
})();
</script>
</body>
</html>
